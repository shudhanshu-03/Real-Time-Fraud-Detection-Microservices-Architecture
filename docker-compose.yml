version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: fraud_user
      POSTGRES_PASSWORD: fraud_pass
      POSTGRES_DB: fraud_transactions
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud_user -d fraud_transactions"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fraud-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fraud-network

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD", "kafka-cluster", "cluster-id", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fraud-network

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    ports:
      - "8081:8081"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'PLAINTEXT://kafka:29092'
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    networks:
      - fraud-network

  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/fraud_graph_pass
    volumes:
      - neo4j_data:/data
    networks:
      - fraud-network

  elasticsearch:
    image: elasticsearch:8.12.0
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - fraud-network

  api-gateway:
    build:
      context: ./services/api-gateway
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - GATEWAY_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    networks:
      - fraud-network

  transaction-service:
    build:
      context: .
      dockerfile: ./services/transaction-service/Dockerfile
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - PG_HOST=postgres
      - PG_USER=fraud_user
      - PG_PASSWORD=fraud_pass
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - REDIS_HOST=redis
    networks:
      - fraud-network

  rule-engine:
    build:
      context: .
      dockerfile: ./services/rule-engine/Dockerfile
    ports:
      - "8003:8003"
      - "50051:50051"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://fraud_user:fraud_pass@postgres:5432/fraud_transactions
      - REDIS_URL=redis://redis:6379/0
    networks:
      - fraud-network

  fraud-orchestrator:
    build:
      context: .
      dockerfile: ./services/fraud-orchestrator/Dockerfile
    ports:
      - "8002:8002"
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - ORCHESTRATOR_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - ORCHESTRATOR_REDIS_URL=redis://redis:6379/0
      - ORCHESTRATOR_RULE_ENGINE_GRPC_TARGET=rule-engine:50051
      - ORCHESTRATOR_ML_SCORING_GRPC_TARGET=ml-scoring-service:50052
      - ORCHESTRATOR_GRAPH_ANALYSIS_GRPC_TARGET=graph-analysis:50053
    networks:
      - fraud-network

  ml-scoring-service:
    build:
      context: .
      dockerfile: ./services/ml-scoring/Dockerfile
    ports:
      - "50052:50052"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379/0
    networks:
      - fraud-network

  graph-analysis:
    build:
      context: .
      dockerfile: ./services/graph-analysis/Dockerfile
    ports:
      - "50053:50053"
    environment:
      - GRPC_PORT=50053
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=fraud_graph_pass
    networks:
      - fraud-network

  alert-service:
    build:
      context: ./services/alert-service
    ports:
      - "8087:8087"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      - PG_HOST=postgres
      - PG_USER=fraud_user
      - PG_PASSWORD=fraud_pass
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    networks:
      - fraud-network

  case-management:
    build:
      context: ./services/case-management
    ports:
      - "8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      - PG_HOST=postgres
      - PG_USER=fraud_user
      - PG_PASSWORD=fraud_pass
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    networks:
      - fraud-network

  stream-processor:
    build:
      context: ./services/stream-processor
    ports:
      - "8090:8090"
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - STREAM_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - STREAM_REDIS_URL=redis://redis:6379/0
    networks:
      - fraud-network

  notification-service:
    build:
      context: ./services/notification-service
    ports:
      - "8089:8089"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - NOTIFY_DATABASE_URL=postgresql+asyncpg://fraud_user:fraud_pass@postgres:5432/fraud_transactions
      - NOTIFY_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - NOTIFY_REDIS_URL=redis://redis:6379/0
    networks:
      - fraud-network

  customer-profile:
    build:
      context: ./services/customer-profile
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - PROFILE_DATABASE_URL=postgresql+asyncpg://fraud_user:fraud_pass@postgres:5432/fraud_transactions
      - PROFILE_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - PROFILE_REDIS_URL=redis://redis:6379/0
    networks:
      - fraud-network

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  elasticsearch_data:
  kafka_data:

networks:
  fraud-network:
    driver: bridge
