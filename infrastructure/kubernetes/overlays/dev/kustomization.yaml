apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fraud-platform

resources:
  - ../../base

commonLabels:
  environment: dev

# ---------------------------------------------------------------------------
# Dev overlay: single-replica, low-resource deployments for local/dev clusters
# ---------------------------------------------------------------------------
patches:
  # ── api-gateway ──────────────────────────────────────────────────────────
  - target:
      kind: Deployment
      name: api-gateway
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: api-gateway
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: api-gateway
                resources:
                  requests:
                    cpu: 100m
                    memory: 128Mi
                  limits:
                    cpu: 250m
                    memory: 256Mi

  # ── transaction-service ──────────────────────────────────────────────────
  - target:
      kind: Deployment
      name: transaction-service
    patch: |
      apiVersion: apps/v1
      kind: Deployment
