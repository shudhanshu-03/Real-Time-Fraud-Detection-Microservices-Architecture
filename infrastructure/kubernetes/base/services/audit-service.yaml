apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-service
  namespace: fraud-platform
  labels:
    app: audit-service
    component: audit
spec:
  replicas: 3
  selector:
    matchLabels:
      app: audit-service
      component: audit
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: audit-service
        component: audit
    spec:
      containers:
        - name: audit-service
          image: fraud-platform/audit-service:latest
          ports:
            - containerPort: 8009
          envFrom:
            - configMapRef:
                name: platform-config
            - secretRef:
                name: platform-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8009
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8009
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: audit-service
  namespace: fraud-platform
  labels:
    app: audit-service
    component: audit
spec:
  type: ClusterIP
  selector:
    app: audit-service
    component: audit
  ports:
    - port: 8009
      targetPort: 8009
      protocol: TCP
