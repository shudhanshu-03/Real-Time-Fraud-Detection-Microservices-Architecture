apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitoring-service
  namespace: fraud-platform
  labels:
    app: monitoring-service
    component: monitoring
spec:
  replicas: 2
  selector:
    matchLabels:
      app: monitoring-service
      component: monitoring
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: monitoring-service
        component: monitoring
    spec:
      containers:
        - name: monitoring-service
          image: fraud-platform/monitoring-service:latest
          ports:
            - containerPort: 8010
          envFrom:
            - configMapRef:
                name: platform-config
            - secretRef:
                name: platform-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8010
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8010
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: monitoring-service
  namespace: fraud-platform
  labels:
    app: monitoring-service
    component: monitoring
spec:
  type: ClusterIP
  selector:
    app: monitoring-service
    component: monitoring
  ports:
    - port: 8010
      targetPort: 8010
      protocol: TCP
