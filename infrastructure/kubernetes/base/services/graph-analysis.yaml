apiVersion: apps/v1
kind: Deployment
metadata:
  name: graph-analysis
  namespace: fraud-platform
  labels:
    app: graph-analysis
    component: scoring
spec:
  replicas: 2
  selector:
    matchLabels:
      app: graph-analysis
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: graph-analysis
        component: scoring
    spec:
      containers:
        - name: graph-analysis
          image: fraud-platform/graph-analysis:latest
          ports:
            - containerPort: 8005
              name: http
            - containerPort: 50053
              name: grpc
          envFrom:
            - configMapRef:
                name: platform-config
            - secretRef:
                name: platform-secrets
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: graph-analysis
  namespace: fraud-platform
  labels:
    app: graph-analysis
    component: scoring
spec:
  type: ClusterIP
  selector:
    app: graph-analysis
  ports:
    - name: http
      port: 8005
      targetPort: 8005
      protocol: TCP
    - name: grpc
      port: 50053
      targetPort: 50053
      protocol: TCP
