apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-scoring
  namespace: fraud-platform
  labels:
    app: ml-scoring
    component: scoring
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ml-scoring
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ml-scoring
        component: scoring
    spec:
      containers:
        - name: ml-scoring
          image: fraud-platform/ml-scoring:latest
          ports:
            - containerPort: 8004
              name: http
            - containerPort: 50052
              name: grpc
          envFrom:
            - configMapRef:
                name: platform-config
            - secretRef:
                name: platform-secrets
          resources:
            requests:
              cpu: 1000m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ml-scoring
  namespace: fraud-platform
  labels:
    app: ml-scoring
    component: scoring
spec:
  type: ClusterIP
  selector:
    app: ml-scoring
  ports:
    - name: http
      port: 8004
      targetPort: 8004
      protocol: TCP
    - name: grpc
      port: 50052
      targetPort: 50052
      protocol: TCP
