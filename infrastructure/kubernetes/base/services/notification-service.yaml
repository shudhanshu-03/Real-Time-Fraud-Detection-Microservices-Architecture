apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: fraud-platform
  labels:
    app: notification-service
    component: notification
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
      component: notification
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: notification-service
        component: notification
    spec:
      containers:
        - name: notification-service
          image: fraud-platform/notification-service:latest
          ports:
            - containerPort: 8008
          envFrom:
            - configMapRef:
                name: platform-config
            - secretRef:
                name: platform-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8008
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8008
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: fraud-platform
  labels:
    app: notification-service
    component: notification
spec:
  type: ClusterIP
  selector:
    app: notification-service
    component: notification
  ports:
    - port: 8008
      targetPort: 8008
      protocol: TCP
