apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-service
  namespace: fraud-platform
  labels:
    app: alert-service
    component: alerting
spec:
  replicas: 3
  selector:
    matchLabels:
      app: alert-service
      component: alerting
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: alert-service
        component: alerting
    spec:
      containers:
        - name: alert-service
          image: fraud-platform/alert-service:latest
          ports:
            - containerPort: 8006
          envFrom:
            - configMapRef:
                name: platform-config
            - secretRef:
                name: platform-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8006
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8006
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: alert-service
  namespace: fraud-platform
  labels:
    app: alert-service
    component: alerting
spec:
  type: ClusterIP
  selector:
    app: alert-service
    component: alerting
  ports:
    - port: 8006
      targetPort: 8006
      protocol: TCP
