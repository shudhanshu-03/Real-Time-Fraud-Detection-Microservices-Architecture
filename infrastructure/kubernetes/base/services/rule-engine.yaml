apiVersion: apps/v1
kind: Deployment
metadata:
  name: rule-engine
  namespace: fraud-platform
  labels:
    app: rule-engine
    component: scoring
spec:
  replicas: 3
  selector:
    matchLabels:
      app: rule-engine
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: rule-engine
        component: scoring
    spec:
      containers:
        - name: rule-engine
          image: fraud-platform/rule-engine:latest
          ports:
            - containerPort: 8003
              name: http
            - containerPort: 50051
              name: grpc
          envFrom:
            - configMapRef:
                name: platform-config
            - secretRef:
                name: platform-secrets
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: rule-engine
  namespace: fraud-platform
  labels:
    app: rule-engine
    component: scoring
spec:
  type: ClusterIP
  selector:
    app: rule-engine
  ports:
    - name: http
      port: 8003
      targetPort: 8003
      protocol: TCP
    - name: grpc
      port: 50051
      targetPort: 50051
      protocol: TCP
