apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-orchestrator
  namespace: fraud-platform
  labels:
    app: fraud-orchestrator
    component: core
spec:
  replicas: 5
  selector:
    matchLabels:
      app: fraud-orchestrator
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: fraud-orchestrator
        component: core
    spec:
      containers:
        - name: fraud-orchestrator
          image: fraud-platform/fraud-orchestrator:latest
          ports:
            - containerPort: 8002
          envFrom:
            - configMapRef:
                name: platform-config
            - secretRef:
                name: platform-secrets
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: fraud-orchestrator
  namespace: fraud-platform
  labels:
    app: fraud-orchestrator
    component: core
spec:
  type: ClusterIP
  selector:
    app: fraud-orchestrator
  ports:
    - port: 8002
      targetPort: 8002
      protocol: TCP
